[package]
name = "dig"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Native only: the web build leaves this crate out (see `ui`'s Cargo.toml).
[dependencies]
analysis = { version = "0.1.0", path = "../analysis" }
arc-swap = "1.9.2"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
platform = { version = "0.1.0", path = "../platform" }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny_http = "0.12.0"
ureq = "3.4.2"
webbrowser = "1.2.4"
