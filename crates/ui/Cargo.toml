[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
analysis = { version = "0.1.0", path = "../analysis" }
audio = { version = "0.1.0", path = "../audio" }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
egui = { version = "0.36.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
platform = { version = "0.1.0", path = "../platform" }
realfft = "3.5.0"
rfd = "0.17.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

# Discogs digging is native only: it runs programs and talks to the network.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dig = { version = "0.1.0", path = "../dig" }

[dev-dependencies]
hound = "3"

# With default features off, winit has no windowing backend on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }
